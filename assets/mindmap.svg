<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1040" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowcyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1480" height="1040" fill="#020617"/>
  <rect width="1480" height="1040" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="48" fill="#e2e8f0" font-size="26" font-weight="bold">ENV-ROVER // SWARM MINDMAP</text>
  <text x="40" y="74" fill="#64748b" font-size="13">how the rovers think, talk and move — one tick of the loop, end to end</text>
  <circle cx="1430" cy="42" r="6" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= STAGE 1: sense ================= -->
  <rect x="40" y="120" width="330" height="240" rx="6" fill="#0f172a"/>
  <rect x="40" y="120" width="330" height="240" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="60" y="148" fill="#34d399" font-size="14" font-weight="bold">1 // SENSE</text>
  <text x="60" y="172" fill="#94a3b8" font-size="11">grid_env.py reads the world state</text>
  <text x="60" y="200" fill="#e2e8f0" font-size="11">• trash tiles: (N,2) coord array</text>
  <text x="60" y="220" fill="#e2e8f0" font-size="11">• rover positions: (x, y) ints</text>
  <text x="60" y="240" fill="#e2e8f0" font-size="11">• targets still valid? check</text>
  <text x="60" y="268" fill="#64748b" font-size="10">a rover keeps its target until the</text>
  <text x="60" y="284" fill="#64748b" font-size="10">trash is scooped (by anyone)</text>
  <rect x="60" y="300" width="290" height="44" rx="4" fill="#020617" stroke="#1e293b"/>
  <text x="74" y="318" fill="#34d399" font-size="10">spawn_trash(n)</text>
  <text x="74" y="334" fill="#64748b" font-size="10">reroll on collision, guard-capped</text>

  <!-- ================= STAGE 2: think ================= -->
  <rect x="560" y="100" width="360" height="280" rx="6" fill="#0f172a"/>
  <rect x="560" y="100" width="360" height="280" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="580" y="128" fill="#22d3ee" font-size="14" font-weight="bold">2 // THINK — the brain</text>
  <text x="580" y="152" fill="#94a3b8" font-size="11">task allocator: ONE call per round</text>
  <text x="580" y="180" fill="#e2e8f0" font-size="11">input: { rovers: [...], trash: [...] }</text>
  <text x="580" y="200" fill="#e2e8f0" font-size="11">output: { rover-1: {x, y}, ... }</text>
  <text x="580" y="228" fill="#64748b" font-size="10">picks WHO chases WHICH trash.</text>
  <text x="580" y="244" fill="#64748b" font-size="10">never how to get there.</text>

  <!-- gemini box -->
  <rect x="580" y="264" width="156" height="72" rx="4" fill="#020617" stroke="#22d3ee"/>
  <text x="594" y="286" fill="#22d3ee" font-size="11" font-weight="bold">gemini-3.8-flash</text>
  <text x="594" y="304" fill="#94a3b8" font-size="10">async, json mode,</text>
  <text x="594" y="318" fill="#94a3b8" font-size="10">thinking_level: low</text>

  <!-- ollama box -->
  <rect x="748" y="264" width="156" height="72" rx="4" fill="#020617" stroke="#34d399"/>
  <text x="762" y="286" fill="#34d399" font-size="11" font-weight="bold">ollama (local)</text>
  <text x="762" y="304" fill="#94a3b8" font-size="10">async stream, thinks</text>
  <text x="762" y="318" fill="#94a3b8" font-size="10">out loud in the hud</text>

  <!-- greedy box -->
  <rect x="580" y="344" width="324" height="26" rx="4" fill="#020617" stroke="#fbbf24"/>
  <text x="594" y="362" fill="#fbbf24" font-size="10">greedy fallback — if the model throttles / lies / breaks json</text>

  <!-- ================= STAGE 3: plan ================= -->
  <rect x="1110" y="100" width="330" height="280" rx="6" fill="#0f172a"/>
  <rect x="1110" y="100" width="330" height="280" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1130" y="128" fill="#a78bfa" font-size="14" font-weight="bold">3 // PLAN — a-star</text>
  <text x="1130" y="152" fill="#94a3b8" font-size="11">grid_env.astar(start, goal)</text>
  <rect x="1130" y="168" width="290" height="90" rx="4" fill="#020617" stroke="#1e293b"/>
  <text x="1144" y="190" fill="#e2e8f0" font-size="11">f(n) = g(n) + h(n)</text>
  <text x="1144" y="208" fill="#94a3b8" font-size="10">g = steps walked from start</text>
  <text x="1144" y="224" fill="#94a3b8" font-size="10">h = manhattan distance to goal</text>
  <text x="1144" y="244" fill="#a78bfa" font-size="10">h = |x - gx| + |y - gy|</text>
  <text x="1130" y="282" fill="#e2e8f0" font-size="11">heapq open set, 4-dir moves</text>
  <text x="1130" y="302" fill="#94a3b8" font-size="10">returns the full tile path,</text>
  <text x="1130" y="318" fill="#94a3b8" font-size="10">rover pops one step per tick</text>
  <text x="1130" y="352" fill="#64748b" font-size="10">verified optimal vs bfs on 30 random mazes</text>

  <!-- arrows sense -> think -> plan -->
  <line x1="370" y1="240" x2="556" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="228" fill="#64748b" font-size="10">world state</text>
  <line x1="920" y1="240" x2="1106" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="954" y="228" fill="#64748b" font-size="10">targets</text>

  <!-- ================= STAGE 4: move + scoop (bottom) ================= -->
  <rect x="560" y="480" width="360" height="150" rx="6" fill="#0f172a"/>
  <rect x="560" y="480" width="360" height="150" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="580" y="508" fill="#fbbf24" font-size="14" font-weight="bold">4 // MOVE + SCOOP</text>
  <text x="580" y="532" fill="#e2e8f0" font-size="11">• one tile per rover per tick</text>
  <text x="580" y="552" fill="#e2e8f0" font-size="11">• walls clip the move, sim never corrupts</text>
  <text x="580" y="572" fill="#e2e8f0" font-size="11">• stand on trash = scoop, +1</text>
  <text x="580" y="592" fill="#64748b" font-size="10">• two rovers CAN share a tile rn (known, accepted)</text>

  <line x1="740" y1="380" x2="740" y2="476" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="754" y="430" fill="#64748b" font-size="10">path steps</text>

  <!-- loop back arrow -->
  <path d="M 556 555 C 380 555 380 240 370 240" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowgreen)"/>
  <text x="300" y="520" fill="#34d399" font-size="10">next tick: re-sense, keep or re-allocate</text>

  <!-- ================= ISO FORMULA BOX ================= -->
  <rect x="40" y="480" width="440" height="150" rx="6" fill="#0f172a"/>
  <rect x="40" y="480" width="440" height="150" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="60" y="508" fill="#22d3ee" font-size="14" font-weight="bold">ISOMETRIC PROJECTION</text>
  <text x="60" y="532" fill="#94a3b8" font-size="10">grid (x, y) -> screen pixels, the visualizer's whole trick</text>
  <rect x="60" y="546" width="400" height="66" rx="4" fill="#020617" stroke="#1e293b"/>
  <text x="76" y="568" fill="#e2e8f0" font-size="12">screen_x = (x - y) * (TILE_W / 2)</text>
  <text x="76" y="590" fill="#e2e8f0" font-size="12">screen_y = (x + y) * (TILE_H / 2)</text>
  <text x="76" y="606" fill="#64748b" font-size="10">TILE_W 44, TILE_H 22 — classic 2:1 iso diamond</text>

  <!-- ================= COMMS TOPOLOGY ================= -->
  <rect x="1040" y="480" width="400" height="440" rx="6" fill="#0f172a"/>
  <rect x="1040" y="480" width="400" height="440" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1060" y="508" fill="#fb7185" font-size="14" font-weight="bold">5 // COMMS — who talks to who</text>
  <text x="1060" y="530" fill="#94a3b8" font-size="10">hub-and-spoke. no rover-to-rover chatter yet.</text>

  <!-- hub -->
  <rect x="1190" y="556" width="140" height="56" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
  <text x="1210" y="580" fill="#fb7185" font-size="12" font-weight="bold">BRAIN</text>
  <text x="1210" y="598" fill="#94a3b8" font-size="10">allocator (async)</text>

  <!-- rover nodes -->
  <rect x="1064" y="668" width="130" height="50" rx="6" fill="#0f172a" stroke="#22d3ee"/>
  <text x="1080" y="690" fill="#22d3ee" font-size="11" font-weight="bold">rover-1</text>
  <text x="1080" y="706" fill="#64748b" font-size="9">pos + target + path</text>

  <rect x="1204" y="748" width="130" height="50" rx="6" fill="#0f172a" stroke="#f472b6"/>
  <text x="1220" y="770" fill="#f472b6" font-size="11" font-weight="bold">rover-2</text>
  <text x="1220" y="786" fill="#64748b" font-size="9">pos + target + path</text>

  <rect x="1344" y="668" width="130" height="50" rx="6" fill="#0f172a" stroke="#fbbf24"/>
  <text x="1360" y="690" fill="#fbbf24" font-size="11" font-weight="bold">rover-3</text>
  <text x="1360" y="706" fill="#64748b" font-size="9">pos + target + path</text>

  <!-- hub to rover arrows (state up, targets down) -->
  <line x1="1210" y1="612" x2="1140" y2="664" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowcyan)"/>
  <line x1="1260" y1="612" x2="1264" y2="744" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowcyan)"/>
  <line x1="1310" y1="612" x2="1380" y2="664" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowcyan)"/>

  <!-- env shared state -->
  <rect x="1064" y="836" width="410" height="56" rx="6" fill="#020617" stroke="#34d399"/>
  <text x="1080" y="858" fill="#34d399" font-size="11" font-weight="bold">SHARED ENV (single source of truth)</text>
  <text x="1080" y="876" fill="#64748b" font-size="10">trash array, walls, tick count — every rover reads/writes the same object</text>

  <line x1="1129" y1="718" x2="1129" y2="832" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1269" y1="798" x2="1269" y2="832" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1409" y1="718" x2="1409" y2="832" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="1060" y="906" fill="#64748b" font-size="10">protocol: rovers POST {name, x, y} + free trash -> brain replies targets json</text>
  <text x="1060" y="922" fill="#64748b" font-size="10">asyncio = one loop, no locks. shared env never mutates across an await</text>

  <!-- ================= bottom note ================= -->
  <text x="40" y="968" fill="#64748b" font-size="11">current limits: rovers can share tiles - allocator prompt is 1-shot - gemini free tier throttles to ~5 rpm (greedy covers)</text>
  <text x="40" y="988" fill="#475569" font-size="10">env-rover // sim backend — hardware integration comes later</text>
</svg>